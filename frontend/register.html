<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        height: 100vh;

        /* 🌑 Same dark medical theme as login */
        background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px);

        padding: 30px;
        border-radius: 18px;
        width: 340px;

        box-shadow: 0 0 25px rgba(0, 255, 200, 0.15),
                    0 0 60px rgba(0, 140, 255, 0.08);

        text-align: center;
        color: white;
        border: 1px solid rgba(255,255,255,0.12);
    }

    h2 {
        margin-bottom: 20px;
        color: #00e6e6;
        letter-spacing: 1px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;

        border: none;
        border-radius: 10px;

        outline: none;
        background: rgba(255,255,255,0.1);
        color: white;

        border: 1px solid rgba(255,255,255,0.15);
    }

    input::placeholder {
        color: rgba(255,255,255,0.6);
    }

    button {
        width: 100%;
        padding: 12px;

        background: linear-gradient(90deg, #00e6e6, #0072ff);
        color: white;

        border: none;
        border-radius: 10px;

        cursor: pointer;
        font-weight: bold;

        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 15px rgba(0, 230, 230, 0.5);
    }

    a {
        color: #00e6e6;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }
</style>

</head>

<body>

<div class="container">

<h2>USER REGISTRATION</h2>

<p id="message" style="font-weight:bold;"></p>

<form id="registerForm">

<input type="text" name="name" placeholder="Enter Name" required>

<input type="email" name="email" placeholder="Enter Email" required>

<input type="password" name="password" placeholder="Enter Password" required>

<button type="submit">Register</button>

</form>

<div id="popup" style="
    display:none;
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 15px 20px;
    color: white;
    border-radius: 10px;
    font-size: 14px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
"></div>

<br>
<a href="login.html">Already have an account? Login</a>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.querySelector("input[name='name']").value.trim();
    const email = document.querySelector("input[name='email']").value.trim();

    const nameRegex = /^[A-Za-z\s]+$/;
    const emailRegex = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;

    if (!nameRegex.test(name)) {
        showPopup("Name must contain only letters", "#ff1744");
        return;
    }

    if (!emailRegex.test(email)) {
        showPopup("Enter valid Gmail (example@gmail.com)", "#ff1744");
        return;
    }

    const formData = new FormData(this);

    fetch("../backend/register.php", {
        method: "POST",
        body: formData
    })
    .then(res => res.text())
    .then(data => {

        if (data.includes("Successful")) {
            showPopup(data, "#00c853");
        } else {
            showPopup(data, "#ff1744");
        }

    });
});

function showPopup(message, color) {
    const popup = document.getElementById("popup");

    popup.innerText = message;
    popup.style.display = "block";
    popup.style.background = color;

    setTimeout(() => {
        popup.style.display = "none";
    }, 3000);
}
</script>

</body>
</html>
